version = 1

# openRuyi Package Monitor follows the openRuyi repository's REUSE conventions.
# Source files carry SPDX headers; data and lock files are annotated here.
[[annotations]]
path = [
  "backend/requirements.lock",
  "backend/requirements-test.lock",
  "config/tracker.toml",
  "frontend/package.json",
  "frontend/package-lock.json",
]
SPDX-FileCopyrightText = "(C) 2026 openRuyi Project Contributors"
SPDX-License-Identifier = "MulanPSL-2.0"

[[annotations]]
path = "frontend/public/openruyi.svg"
SPDX-FileCopyrightText = ["(C) 2026 Institute of Software, Chinese Academy of Sciences (ISCAS)", "(C) 2026 openRuyi Project Contributors"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

