# Visual emphasis is presentation policy, not provider severity.

[styles.important]
order = 0
background = "#b42318"
foreground = "#ffffff"

[styles.warning]
order = 1
background = "#865b05"
foreground = "#ffffff"

[styles.neutral]
order = 2
background = "#626b75"
foreground = "#ffffff"

[labels."Outdated"]
facet = true
style = "important"

[labels."Untracked"]
facet = true
style = "neutral"

[labels."CheckFailed"]
facet = true
style = "neutral"

[labels."DepMismatch"]
facet = true
style = "important"

[labels."Advisory"]
facet = true
style = "important"

[labels."KEV"]
style = "important"

[labels."LicenseDiff"]
facet = true
style = "warning"

[labels."Yanked"]
facet = true
style = "important"

[labels."EOL"]
facet = true
style = "important"

[labels."Out of date"]
text = "Stale"

[labels."Build system"]
text = "BuildSystem"

[labels.Custom]
text = "❔ custom"

[labels."Not mapped"]
text = "Unmapped"

[labels."Not packaged"]
text = "NotPackaged"

[labels."Ambiguous mapping"]
text = "Ambiguous"

[labels."DepChanges"]
style = "warning"

[labels."Failed"]
icon = "obs-circle-exclamation"
style = "important"

[labels."Unresolvable"]
icon = "obs-circle-exclamation"
style = "important"

[labels."Broken"]
icon = "obs-circle-exclamation"
style = "important"

[labels.PR]
facet = true
style = "neutral"

[labels.Issue]
facet = true
style = "neutral"

[styles.github-open]
background = "#1a7f37"
foreground = "#ffffff"

[styles.github-merged]
background = "#8250df"
foreground = "#ffffff"

[labels.github-open]
style = "github-open"

[labels.github-merged]
style = "github-merged"

[labels.github-closed]
style = "important"

[labels.github-inactive]
style = "neutral"

[labels."Succeeded"]
icon = "obs-check"
icon_only = true
style = "build-success"

[labels."Blocked"]
icon = "obs-shield"
style = "warning"

[labels."Scheduled"]
icon = "obs-hourglass-half"
style = "build-active"

[labels."Dispatching"]
icon = "obs-plane-departure"
style = "build-active"

[labels."Building"]
icon = "obs-gear"
style = "build-active"

[labels."Finishing"]
icon = "obs-check"
style = "build-active"

[labels."Signing"]
icon = "obs-signature"
style = "build-active"

[labels."Disabled"]
icon = "obs-ban"
style = "neutral"

[labels."Excluded"]
icon = "obs-ban"
style = "neutral"

[labels."Locked"]
icon = "obs-lock"
style = "neutral"

[labels."Deleting"]
icon = "obs-eraser"
style = "neutral"

[labels."No result"]
icon = "obs-question"
style = "neutral"

[styles.build-success]
background = "#1a7f37"
foreground = "#ffffff"

[styles.build-active]
background = "#0969da"
foreground = "#ffffff"
