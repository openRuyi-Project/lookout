# Minimal packaging, test, and lint config for a read-only PoC collector.
# Runtime dependencies are pinned in requirements.lock (tested on Fedora 43 /
# Python 3.14); native rpm is provided by the distribution, not by pip.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openruyi-tracker"
version = "0.1.0"
description = "Read-only OBS and nvchecker package status snapshot"
license = "MulanPSL-2.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "defusedxml==0.7.1",
  "nvchecker==2.22",
  "jq>=1.8,<2",
  "packaging>=24",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
# ruff is a developer-only linter; it is not installed in the runtime lock.
lint = ["ruff>=0.6"]

[tool.setuptools]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
