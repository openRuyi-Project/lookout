# Dependency inputs; requirements*.lock are generated from this file.
# Native rpm is provided by the distribution, not by pip.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openruyi-tracker"
version = "0.2.0"
description = "Read-only OBS and nvchecker package status snapshot"
license = "MulanPSL-2.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "defusedxml==0.7.1",
  "nvchecker==2.22",
  "jq>=1.8,<2",
  "packaging>=24.2",
  "pydantic>=2.12,<3",
  "tomlkit>=0.15.1,<1",
  "license-expression>=30.4.4,<31",
]

[project.optional-dependencies]
test = ["httpx2>=2.13,<3", "pytest>=8,<10", "hypothesis>=6.168.1,<7", "setuptools>=68"]
quality = ["ruff==0.16.9", "pyright==1.1.414", "import-linter==2.15",
           "vulture==2.16", "radon==6.0.1", "deptry==0.25.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracker", "tracker.*", "nvchecker_source"]
namespaces = true

[tool.setuptools.package-data]
"tracker.presentation" = ["labels.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "I", "UP"]

[tool.pyright]
include = ["tracker", "nvchecker_source"]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "standard"

[tool.deptry]
known_first_party = ["tracker", "nvchecker_source"]
# Native RPM bindings come from Fedora; uvicorn is a CLI and jq serves native rules.
extend_exclude = ["tests"]
optional_dependencies_dev_groups = ["test", "quality"]
per_rule_ignores = { DEP001 = ["rpm"], DEP003 = ["rpm"], DEP002 = ["uvicorn", "jq"] }

[tool.importlinter]
root_package = "tracker"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Read models do not depend on HTTP or presentation"
type = "forbidden"
source_modules = ["tracker.readmodel"]
forbidden_modules = ["tracker.api", "tracker.presentation"]

[[tool.importlinter.contracts]]
name = "Observation adapters do not depend on readers"
type = "forbidden"
source_modules = ["tracker.monitors", "tracker.providers"]
forbidden_modules = ["tracker.api", "tracker.presentation", "tracker.readmodel"]

[[tool.importlinter.contracts]]
name = "Presentation does not depend on HTTP routes"
type = "forbidden"
source_modules = ["tracker.presentation"]
forbidden_modules = ["tracker.api"]
