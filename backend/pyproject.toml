# Dependency inputs; requirements*.lock are generated from this file.
# Native rpm is provided by the distribution, not by pip.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openruyi-tracker"
version = "0.1.0"
description = "Read-only OBS and nvchecker package status snapshot"
license = "MulanPSL-2.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.28,<1",
  "defusedxml==0.7.1",
  "nvchecker==2.22",
  "jq>=1.8,<2",
  "packaging>=24.2",
  "pydantic>=2.12,<3",
  "tomlkit>=0.15.1,<1",
  "license-expression>=30.4.4,<31",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "hypothesis>=6.168.1,<7"]
# ruff is a developer-only linter; it is not installed in the runtime lock.
lint = ["ruff>=0.6"]

[tool.setuptools]
packages = ["tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
