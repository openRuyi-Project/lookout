# Version tracking
schema = 1

[__config__]
"max_concurrency" = 4
"http_timeout" = 300

[group."cratesio"]
"source" = "cratesio"
"cratesio" = "{cratesio}"
"include_regex" = "{include_regex}"

[group."cratesio".packages]
"bindgen" = {"cratesio" = "bindgen-cli", "include_regex" = "^0\\.72\\.[0-9]+$"}
