regex = '(?s)\[pkg\.rust\]\s+version = "([0-9]+\.[0-9]+\.[0-9]+) '

[seastar]
source = "git"
git = "https://github.com/scylladb/seastar"
include_regex = '^seastar\-[0-9]+(?:\.[0-9]+){0,3}$'
prefix = "seastar-"

[sg3_utils]
source = "regex"
url = "https://sg.danny.cz/sg/p/"
regex = '(?<![A-Za-z0-9_.+-])sg3_utils\-([0-9]+(?:\.[0-9]+){0,3})\.tar\.xz'

[signon-kwallet-extension]
source = "git"
git = "https://github.com/KDE/signon-kwallet-extension"
prefix = "v"
include_regex = '^v[0-9]+\.[0-9]+\.[0-9]+$'
exclude_regex = '^v[0-9]+\.[0-9]+\.[89][0-9]$'

[slibtool]
source = "regex"
url = "https://midipix.org/dl/slibtool/"
regex = '(?<![A-Za-z0-9_.+-])slibtool\-([0-9]+(?:\.[0-9]+){0,3})\.tar\.xz'

[squashfs-tools-ng]
source = "regex"
url = "https://infraroot.at/pub/squashfs/"
regex = '(?<![A-Za-z0-9_.+-])squashfs\-tools\-ng\-([0-9]+(?:\.[0-9]+){0,3})\.tar\.gz'

[tclap]
source = "regex"
url = "https://sourceforge.net/projects/tclap/rss?path=/"
regex = 'tclap\-([0-9]+(?:\.[0-9]+)+)\.tar\.gz'

[tdb]
source = "regex"
url = "https://samba.org/ftp/tdb/"
regex = '(?<![A-Za-z0-9_.+-])tdb\-([0-9]+(?:\.[0-9]+){0,3})\.tar\.gz'

[tftp]
source = "git"
git = "https://git.kernel.org/pub/scm/network/tftp/tftp-hpa.git"
include_regex = '^tftp\-hpa\-[0-9]+(?:\.[0-9]+)+$'
prefix = "tftp-hpa-"

[tunctl]
source = "regex"
url = "https://sourceforge.net/projects/tunctl/rss?path=/"
regex = 'tunctl\-([0-9]+(?:\.[0-9]+)+)\.tar\.gz'

[u-boot-menu-ng]
source = "git"
git = "https://github.com/SalimTerryLi/u-boot-menu-ng"
include_regex = '^v[0-9]+(?:\.[0-9]+){0,3}$'
prefix = "v"

[unbound]
source = "regex"
url = "https://nlnetlabs.nl/downloads/unbound/"
regex = '(?<![A-Za-z0-9_.+-])unbound\-([0-9]+(?:\.[0-9]+){0,3})\.tar\.gz'

[vlc]
source = "regex"
url = "https://download.videolan.org/pub/videolan/vlc/"
regex = 'href="([0-9]+\.[0-9]+\.[0-9]+)/"'

[wayback]
source = "git"
git = "https://gitlab.freedesktop.org/wayback/wayback"
include_regex = '^[0-9]+(?:\.[0-9]+){0,3}$'

[wolfssl]
source = "git"
git = "https://github.com/wolfssl/wolfssl"
include_regex = '^v[0-9]+(?:\.[0-9]+){0,3}\-stable$'
prefix = "v"
from_pattern = '\-stable$'
to_pattern = ""

[xerces-c]
source = "git"
git = "https://github.com/apache/xerces-c"
include_regex = '^v[0-9]+(?:\.[0-9]+){0,3}$'
prefix = "v"

[xmlrpc-c]
source = "regex"
url = "https://sourceforge.net/projects/xmlrpc-c/rss?path=/"
regex = 'xmlrpc\-([0-9]+(?:\.[0-9]+)+)\.tgz'

[xmlstarlet]
source = "regex"
url = "https://sourceforge.net/projects/xmlstar/rss?path=/"
regex = 'xmlstarlet\-([0-9]+(?:\.[0-9]+)+)\.tar\.gz'

[xmltoman]
source = "git"
git = "https://github.com/Distrotech/xmltoman"
include_regex = '^[0-9]+(?:\.[0-9]+){0,3}$'

[zsh]
source = "regex"
url = "https://sourceforge.net/projects/zsh/rss?path=/"
regex = 'zsh\-([0-9]+(?:\.[0-9]+)+)\.tar\.xz'
