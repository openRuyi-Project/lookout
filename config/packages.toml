# Release-line labels are derived from the package name (foo-N.N -> N.x).
# Only genuine exceptions to that rule need an explicit binding here.

[avahi]
comparable = false

[bash]

[bash.monitors.security]
vendor = "gnu"
product = "bash"

[cloud-hypervisor]
compare = "cloud-hypervisor@commits"
watch = ["cloud-hypervisor"]

[gcc16]
track_label = "16.x"

[glibc]
compare = "glibc@commits"
watch = ["glibc"]

# Product identities and cycle granularity verified against SPEC URLs and the
