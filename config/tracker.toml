[monitors]
enabled = ["eol", "security", "license", "yanked", "requires"]
stale_after_seconds = 86400
batch_size = 256
workers = 4

[openruyi.dependencies]
python = "python"
rust = "rust"

[packages.python]
monitors = { eol = { product = "python", cycle_parts = 2 } }

[packages.nodejs]
monitors = { eol = { product = "nodejs", cycle_parts = 1 } }

[packages.postgresql]
monitors = { eol = { product = "postgresql", cycle_parts = 1 } }

# Product identities and cycle granularity verified against SPEC URLs and the
# provider's release-cycle catalog. A missing future cycle remains unsupported.
[packages.go]
monitors = { eol = { product = "go", cycle_parts = 2 } }

[packages.ruby]
monitors = { eol = { product = "ruby", cycle_parts = 2 } }

[packages.php]
monitors = { eol = { product = "php", cycle_parts = 2 } }

[packages.mariadb]
monitors = { eol = { product = "mariadb", cycle_parts = 2 } }

[packages.nginx]
monitors = { eol = { product = "nginx", cycle_parts = 2 } }

[packages.httpd]
monitors = { eol = { product = "apache-http-server", cycle_parts = 2 } }

[packages.bash]
monitors = { security = { vendor = "gnu", product = "bash" } }

[packages.libxml2]
monitors = { security = { vendor = "xmlsoft", product = "libxml2" } }

