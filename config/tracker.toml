packages_config = "packages.toml"

[obs]
api_url = "https://build.openruyi.cn/public"
web_url = "https://build.openruyi.cn"
project = "openruyi"

[[targets]]
id = "rva23"
label = "rva23"
repository = "riscv64"
architecture = "riscv64"

[[targets]]
id = "rva20"
label = "rva20"
repository = "rva20"
architecture = "riscv64"

[[targets]]
id = "x86_64"
label = "x86_64"
repository = "x86_64"
architecture = "x86_64"

[collector]
nvchecker_config = "versions/nvchecker.toml"
obs_interval_seconds = 60
build_interval_seconds = 15
nvchecker_interval_seconds = 21600
stale_after_seconds = 86400
obs_stale_after_seconds = 300
native_spec_fallback = true
source_batch_size = 150
source_workers = 4
timeout_seconds = 20
spec_fetch_retries = 2
nvchecker_timeout_seconds = 7200

# Identities only: revisions and hashes come from each OBS observation. A changed
# macro package invalidates the native fallback cache, even for unchanged SPECs.
spec_macro_package = "rpm-config-openruyi"
spec_macro_files = ["_service:obs_scm:macros.buildsystem", "_service:obs_scm:macros.aaa-buildsystem.rust"]



[monitors]
enabled = ["eol", "security", "license", "yanked", "requires"]
stale_after_seconds = 86400
batch_size = 256
workers = 4

[openruyi.dependencies]
perl = "perl"
python = "python"
rust = "rust"
# Registry identities for source packages tracked through their upstream forge.
# SPEC Source0 repositories: pytorch/{pytorch,vision,audio}, pypa/wheel, jcrist/msgspec.
"pypi.torch" = "python-torch"
"pypi.torchvision" = "python-torchvision"
"pypi.torchaudio" = "python-torchaudio"
"pypi.wheel" = "python-wheel"
"pypi.msgspec" = "python-msgspec"

[openruyi.dependency_environments.pep508]
sys_platform = "linux"
os_name = "posix"
platform_system = "Linux"
implementation_name = "cpython"
platform_python_implementation = "CPython"

