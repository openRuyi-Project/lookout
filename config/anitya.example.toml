# EXAMPLE ONLY. Not loaded by the live collector. Replace with a VERIFIED project ID.
["widget@3"]
source = "jq"
url = "https://release-monitoring.org/api/v2/versions/?project_id=PROJECT_ID"
filter = ".stable_versions[]"
include_regex = '^v?3\.[0-9]+(?:\.[0-9]+)*$'
prefix = "v"

