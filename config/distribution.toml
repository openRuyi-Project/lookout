[dependencies]
perl = "perl"
python = "python"
rust = "rust"
# Registry identities for source packages tracked through their upstream forge.
# SPEC Source0 repositories: pytorch/{pytorch,vision,audio}, pypa/wheel, jcrist/msgspec.
"pypi.torch" = "python-torch"
"pypi.torchvision" = "python-torchvision"
"pypi.torchaudio" = "python-torchaudio"
"pypi.wheel" = "python-wheel"
"pypi.msgspec" = "python-msgspec"

[dependency_environments.pep508]
sys_platform = "linux"
os_name = "posix"
platform_system = "Linux"
implementation_name = "cpython"
platform_python_implementation = "CPython"

[buildsystems.rustcrates]
icon = "rust"
background = "#8c3d19"
foreground = "#ffffff"
[buildsystems.golangmodules]
icon = "gopher"
background = "#075f72"
foreground = "#ffffff"
