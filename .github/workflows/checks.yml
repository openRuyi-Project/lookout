name: Release
run-name: Release (${{ inputs.bump }})
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Select the release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -eu
          test "$GITHUB_REF" = refs/heads/main
          VERSION=$(python3 scripts/release-version.py "$BUMP")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          printf '### Release v%s\n' "$VERSION" >> "$GITHUB_STEP_SUMMARY"
  verify:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release: true
  publish:
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: tested-image.tar
          skip-decompress: true
          digest-mismatch: error
      - name: Publish the tested image and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -eu
          docker load --input tested-image.tar
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' openruyi-lookout:test)" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' openruyi-lookout:test)" = "$VERSION"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' openruyi-lookout:test)" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "v$VERSION" --generate-notes
          docker tag openruyi-lookout:test "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker tag openruyi-lookout:test "$IMAGE:v$VERSION"
          docker push "$IMAGE:v$VERSION"
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          for CHANNEL in main latest; do
            docker tag openruyi-lookout:test "$IMAGE:$CHANNEL"
            docker push "$IMAGE:$CHANNEL"
          done
